name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-storage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew.bat --no-daemon test --tests dev.shirokaicrates.storage.PortableStorageTest
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon test build projectArchive
      - uses: actions/upload-artifact@v4
        with:
          name: shirokai-crates
          path: |
            build/libs/shirokai-crates-*.jar
            !build/libs/*-sources.jar
            build/distributions/*.zip
            build/reports/tests/test/
            src/main/resources/defaults/
            examples/
            docs/
